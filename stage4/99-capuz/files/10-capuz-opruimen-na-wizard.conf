# CaPuZ: zodra de M5Stack-wizard (LaunchWizard) klaar is, meteen de eenmalige
# opruiming starten in plaats van pas bij de volgende start. Bespaart een
# herstart. Mislukt dit (bijv. tijdens afsluiten), dan draait de opruiming
# gewoon bij de volgende start.
[Service]
ExecStopPost=-/usr/bin/systemctl start --no-block capuz-firstboot-cleanup.service
