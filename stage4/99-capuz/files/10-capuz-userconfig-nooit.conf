# CaPuZ: de Raspberry Pi-hernoemdialoog (userconfig) nooit starten.
# De M5Stack-wizard (LaunchWizard) regelt gebruiker en wachtwoord al. Zodra het
# systeem zonder bureaublad start, opent userconfig onzichtbaar een dialoog op
# tty8 die de toetsaanslagen van het CaPuZ-toetsenbord opvangt en zo ongemerkt
# de gebruiker kan hernoemen. De export-stap van pi-gen zet userconfig steeds
# opnieuw aan (rename-user), daarom een voorwaarde in plaats van "disable".
# Bewust toch nodig? Maak dan /etc/capuz/userconfig-toestaan aan.
[Unit]
ConditionPathExists=/etc/capuz/userconfig-toestaan
