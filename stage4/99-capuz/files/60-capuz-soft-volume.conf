# CaPuZ: volume van de ES8389-luidspreker in software toepassen.
# Zonder deze regel wordt de volume-instelling (Settings > Volume) wel
# opgeslagen maar niet toegepast: alles klinkt op vol volume.
# Zie https://github.com/CardputerZero/launcher/issues/287
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" } ]
    actions = { update-props = { api.alsa.soft-mixer = true } }
  }
]
